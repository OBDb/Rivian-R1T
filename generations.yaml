generations:
  - name: "First Generation (Gen 1)"
    start_year: 2022
    end_year: 2023
    description: "The first generation Rivian R1T launched in 2022 as the first mass-produced electric pickup truck to reach the market. Built on Rivian's skateboard platform, it featured a domain-based architecture with 17 ECUs. The Gen 1 model was initially offered exclusively with a quad-motor powertrain delivering approximately 835 horsepower and 908 lb-ft of torque, providing precise torque vectoring control with one motor per wheel. The quad-motor version could accelerate from 0-60 mph in approximately 3 seconds. Battery options included 105 kWh (Standard), 135 kWh (Large), and 180 kWh (Max) packs. The adaptive air suspension provided up to 14.9 inches of ground clearance and could ford water up to 3.3 feet deep. Unique features included the 'gear tunnel' pass-through storage space and a premium interior with sustainable materials, panoramic glass roof, and a 16-inch central touchscreen. Towing capacity was up to 11,000 pounds."

  - name: "Second Generation (Gen 2)"
    start_year: 2024
    end_year: null
    description: "The second generation R1T introduced in 2024 features a new zonal wiring architecture that reduces total wiring length by 1.6 miles and weight significantly, cutting material costs by 20% and carbon footprint by 15%. The new architecture uses only four main ECUs (infotainment, autonomy, vehicle access, drive units, and battery management) plus three additional ECUs for remaining functions, compared to 17 ECUs in Gen 1. The dual-motor powertrain became more prevalent, with the Performance Dual-Motor option offering approximately 665 horsepower and 829 lb-ft of torque. Battery options were updated to 105 kWh (Standard), 135 kWh (Large), and 149 kWh (Max). The Gen 2 model continued to offer the gear tunnel, premium interior with sustainable materials, and advanced Driver+ assistance system. The 2024 model year R1T was awarded 'Top Safety Pick+' by IIHS."